name: Latest releases

# Keeps the release feed in the profile README current. Scheduled rather than
# event-driven because a release happens in another repository, and a schedule
# needs no cross-repository token to work.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the release table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/releases.js

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh the release feed" README.md
            git push
          else
            echo "nothing to commit"
          fi
